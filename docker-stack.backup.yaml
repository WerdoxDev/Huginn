version: "3.8"

# Deploy separately so application deployments keep backups running.
services:
   postgres-backup:
      image: ghcr.io/werdoxdev/huginn-backup:b2
      environment:
         PGHOST: huginn-backend_postgres
         PGPORT: "5432"
         PGUSER: huginn
         PGDATABASE: huginn
         PGPASSWORD_FILE: /run/secrets/postgres_password
         RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?Set RESTIC_REPOSITORY to the B2 S3 repository URL}
         RESTIC_PASSWORD_FILE: /run/secrets/postgres_backup_password
         B2_KEY_ID_FILE: /run/secrets/postgres_backup_b2_key_id
         B2_APPLICATION_KEY_FILE: /run/secrets/postgres_backup_b2_application_key
         BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      secrets:
         - postgres_password
         - postgres_backup_password
         - postgres_backup_b2_key_id
         - postgres_backup_b2_application_key
      networks:
         - database
         - backup_egress
      stop_grace_period: 2m
      deploy:
         replicas: 1
         placement:
            constraints:
               - node.labels.huginn.postgres == true
         update_config:
            order: stop-first
         resources:
            limits:
               memory: 512m
               cpus: "1.0"
         restart_policy:
            condition: on-failure
            delay: 60s

networks:
   database:
      external: true
   backup_egress:
      driver: overlay

secrets:
   postgres_password:
      external: true
   postgres_backup_password:
      external: true
   postgres_backup_b2_key_id:
      external: true
   postgres_backup_b2_application_key:
      external: true
