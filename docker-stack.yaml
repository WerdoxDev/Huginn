version: "3.8"

networks:
   caddy:
      external: true
   dozzle:
      driver: overlay
   database:
      driver: overlay
      internal: true

volumes:
   postgres_data:
      external: true
      name: huginn_postgres_data

services:
   postgres:
      image: postgres:18
      environment:
         - POSTGRES_DB=huginn
         - POSTGRES_USER=huginn
         - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
         - PGDATA=/var/lib/postgresql/18/docker
      secrets:
         - postgres_password
      volumes:
         - postgres_data:/var/lib/postgresql
      networks:
         - database
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U huginn -d huginn"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 30s
      stop_grace_period: 60s
      deploy:
         replicas: 1
         placement:
            constraints:
               - node.labels.huginn.postgres == true
         update_config:
            order: stop-first
         resources:
            limits:
               memory: 1g
               cpus: "1.0"
         restart_policy:
            condition: on-failure
            delay: 5s

   dozzle:
      image: amir20/dozzle:latest
      environment:
         - DOZZLE_MODE=swarm
      volumes:
         - /var/run/docker.sock:/var/run/docker.sock
         - /opt/dozzle/data:/data # persist settings per node
      networks:
         - dozzle
         - caddy
      deploy:
         mode: global # runs one instance on every node

   caddy:
      image: ghcr.io/werdoxdev/caddy:latest
      configs:
         - source: caddy_config
           target: /etc/caddy/Caddyfile
      networks:
         - caddy
      deploy:
         restart_policy:
            condition: on-failure

   server:
      image: ghcr.io/werdoxdev/huginn-server:${HUGINN_BACKEND_TAG:-postgres}
      environment:
         - SERVER_HOST=0.0.0.0
         - SERVER_PORT=3004
         - ALLOWED_ORIGINS=http://localhost:5173/,https://app.huginn.dev/,https://dev.huginn.dev/,https://huginn.dev
         - CDN_LOCAL_URL=http://cdn:3002/cdn
         - CDN_PUBLIC_URL=https://midgard.huginn.dev/cdn
         - INSTANCE_ID=midgard
         - OTEL_SERVICE_NAME=server
         - 'INSTANCE_URLS_BY_HOST={"midgard.huginn.dev":{"origin":"https://midgard.huginn.dev", "posthog":"https://e.huginn.dev", "otlp": "https://otlp.huginn.dev"},"huginn.werdox.com":{"origin":"https://huginn.werdox.com", "posthog": "https://e-huginn.werdox.com", "otlp": "https://otlp-huginn.werdox.com"}}'
      secrets:
         - backend_secrets
         - postgres_connection
      networks:
         - caddy
         - database
      deploy:
         resources:
            limits:
               memory: 2g
               cpus: "2.0"
         restart_policy:
            condition: on-failure
            delay: 5s

   cdn:
      image: ghcr.io/werdoxdev/huginn-cdn:${HUGINN_BACKEND_TAG:-postgres}
      environment:
         - CDN_HOST=0.0.0.0
         - CDN_PORT=3002
         - OTEL_SERVICE_NAME=cdn
      secrets:
         - backend_secrets
         - postgres_connection
      networks:
         - caddy
         - database
      deploy:
         resources:
            limits:
               memory: 2g
               cpus: "2.0"
         restart_policy:
            condition: on-failure
            delay: 5s

   voice:
      image: ghcr.io/werdoxdev/huginn-voice:${HUGINN_BACKEND_TAG:-postgres}
      environment:
         - VOICE_HOST=0.0.0.0
         - VOICE_PORT=3003
         - MEDIA_LISTEN_INFOS=udp:44443:0.0.0.0:midgard.huginn.dev;tcp:44443:0.0.0.0:midgard.huginn.dev;udp:44444:0.0.0.0:91.67.253.221;tcp:44444:0.0.0.0:91.67.253.221
         - OTEL_SERVICE_NAME=voice
      ports:
         - target: 44444
           published: 44444
           protocol: udp
           mode: host
         - target: 44443
           published: 44443
           protocol: udp
           mode: host
         - target: 44443
           published: 44443
           protocol: tcp
           mode: host
         - target: 44444
           published: 44444
           protocol: tcp
           mode: host
      secrets:
         - backend_secrets
         - postgres_connection
      networks:
         - caddy
         - database
      deploy:
         resources:
            limits:
               memory: 2g
               cpus: "2.0"
         restart_policy:
            condition: on-failure
            delay: 5s

configs:
   caddy_config:
      external: true

secrets:
   backend_secrets:
      external: true
   postgres_password:
      external: true
   postgres_connection:
      external: true
