name: release
permissions:
   contents: write
   pull-requests: write
on:
   workflow_dispatch:
      inputs:
         force_app_release:
            description: "Force app release even if no changes detected"
            required: false
            type: boolean

         force_api_publish:
            description: "Force API publish even if no changes detected"
            required: false
            type: boolean

         app_version:
            description: "Override app version"
            required: false
            type: string

         android_requires_native_update:
            description: "Require Google Play update before this and later Android OTA updates"
            required: false
            type: boolean

   push:
      branches:
         - master
         - release
jobs:
   release-please:
      runs-on: ubuntu-latest
      outputs:
         app_release_created: ${{ steps.outputs.outputs.app_release_created }}
         api_release_created: ${{ steps.outputs.outputs.api_release_created }}
         app_version: ${{ steps.outputs.outputs.app_version }}

      steps:
         - uses: actions/checkout@v4

         - name: run release-please on release commit or dispatch
           id: release
           uses: googleapis/release-please-action@v4
           with:
              target-branch: ${{ github.ref_name }}
           if: |
              github.event_name == 'workflow_dispatch' ||
              contains(github.event.head_commit.message, ': release')

         - name: Compute outputs
           id: outputs
           run: |
              if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_api_publish }}" == "true" ]]; then
                 echo "api_release_created=true" >> "$GITHUB_OUTPUT"
              else
                 echo "api_release_created=${{ steps.release.outputs['packages/huginn-api--release_created'] || 'false' }}" >> "$GITHUB_OUTPUT"
              fi

              if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.app_version }}" ]]; then
                 echo "app_release_created=${{ inputs.force_app_release }}" >> "$GITHUB_OUTPUT"
                 echo "app_version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
              else
                 echo "app_release_created=${{ steps.release.outputs['packages/huginn-app--release_created'] || 'false' }}" >> "$GITHUB_OUTPUT"
                 echo "app_version=${{ steps.release.outputs['packages/huginn-app--version'] || 'unknown' }}" >> "$GITHUB_OUTPUT"
              fi
   publish-desktop:
      needs: release-please
      strategy:
         fail-fast: false
         matrix:
            include:
               - platform: "windows-latest"
                 args: ""
      runs-on: ${{ matrix.platform }}
      if: ${{needs.release-please.outputs.app_release_created == 'true'}}
      env:
         VITE_PUBLIC_POSTHOG_KEY: ${{secrets.VITE_PUBLIC_POSTHOG_KEY}}
         VITE_PUBLIC_CLOUDFLARE_TURN_ID: ${{secrets.VITE_PUBLIC_CLOUDFLARE_TURN_ID}}
         VITE_PUBLIC_CLOUDFLARE_TURN_TOKEN: ${{secrets.VITE_PUBLIC_CLOUDFLARE_TURN_TOKEN}}
         VITE_PUBLIC_OAUTH_REDIRECT: ${{secrets.VITE_PUBLIC_OAUTH_REDIRECT}}
         POSTHOG_CLI_API_KEY: ${{secrets.POSTHOG_CLI_API_KEY}}
         POSTHOG_PROJECT_ID: ${{secrets.POSTHOG_PROJECT_ID}}
         CI: ${{github.env.CI}}
      steps:
         - uses: actions/checkout@v4

         - name: Install PNPM
           uses: pnpm/action-setup@v4

         - name: Install Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - name: Install dependencies
           run: cd packages/huginn-app && pnpm install --ignore-scripts

         - name: Setup Cmake
           uses: jwlawson/actions-setup-cmake@v2
           with:
              cmake-version: "4.x.x"

         - name: Compile native-addon
           run: cd packages/native-addon && pnpm install && pnpm run build

         - name: Build App
           run: cd packages/huginn-app && pnpm run build

         - name: Upload App
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: cd packages/huginn-app && bun run scripts/upload.ts --mode windows

   publish-android:
      needs: release-please
      runs-on: "ubuntu-latest"
      if: ${{needs.release-please.outputs.app_release_created == 'true'}}
      env:
         VITE_PUBLIC_POSTHOG_KEY: ${{secrets.VITE_PUBLIC_POSTHOG_KEY}}
         VITE_PUBLIC_CLOUDFLARE_TURN_ID: ${{secrets.VITE_PUBLIC_CLOUDFLARE_TURN_ID}}
         VITE_PUBLIC_CLOUDFLARE_TURN_TOKEN: ${{secrets.VITE_PUBLIC_CLOUDFLARE_TURN_TOKEN}}
         VITE_PUBLIC_OAUTH_REDIRECT: ${{secrets.VITE_PUBLIC_OAUTH_REDIRECT}}
         POSTHOG_CLI_API_KEY: ${{secrets.POSTHOG_CLI_API_KEY}}
         POSTHOG_PROJECT_ID: ${{secrets.POSTHOG_PROJECT_ID}}
         RELEASE_STORE_BASE64: ${{secrets.RELEASE_STORE_BASE64}}
         RELEASE_STORE_PASSWORD: ${{secrets.RELEASE_STORE_PASSWORD}}
         RELEASE_KEY_ALIAS: ${{secrets.RELEASE_KEY_ALIAS}}
         RELEASE_KEY_PASSWORD: ${{secrets.RELEASE_KEY_PASSWORD}}
         RELEASE_STORE_FILE: ${{github.workspace}}/packages/huginn-app/android/app/certs/huginn-release.keystore
         CI: ${{github.env.CI}}
         CAPAWESOME_PRIVATE_KEY: ${{secrets.CAPAWESOME_PRIVATE_KEY}}
         CAPAWESOME_PUBLIC_KEY: ${{secrets.CAPAWESOME_PUBLIC_KEY}}
         ANDROID_REQUIRES_NATIVE_UPDATE: ${{inputs.android_requires_native_update || false}}
      steps:
         - uses: actions/checkout@v4

         - name: Install PNPM
           uses: pnpm/action-setup@v4

         - name: Install Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - name: Set up JDK
           uses: actions/setup-java@v4
           with:
              java-version: "21"
              distribution: "temurin"

         - name: Install dependencies
           run: cd packages/huginn-app && pnpm install --ignore-scripts

         - name: Decode keystore
           run: mkdir -p packages/huginn-app/android/app/certs && echo $RELEASE_STORE_BASE64 | base64 -d -i > $RELEASE_STORE_FILE

         - name: Build App
           run: |
              cd packages/huginn-app
              pnpm run cap:release-build
              pnpm run cap:release-bundle

         - name: Bundle App
           run: cd packages/huginn-app && bun run scripts/bundle-android.ts

         - name: Upload App
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: cd packages/huginn-app && bun run scripts/upload.ts --mode android

         - name: Publish to Google Play
           uses: r0adkll/upload-google-play@v1
           with:
              serviceAccountJsonPlainText: ${{secrets.PLAY_SERVICE_ACCOUNT_JSON}}
              packageName: dev.huginn
              releaseFile: packages/huginn-app/android/app/build/outputs/bundle/release/app-release.aab
              tracks: internal

   publish-api:
      runs-on: ubuntu-latest
      permissions:
         contents: read
         id-token: write
      needs: release-please
      if: ${{needs.release-please.outputs.api_release_created == 'true'}}
      steps:
         - uses: actions/checkout@v4

         - name: Install PNPM
           uses: pnpm/action-setup@v4
           with:
              run_install: false

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
              cache: "pnpm"

         - name: Publish API
           run: |
              npm install -g npm@latest
              cd packages/huginn-api
              pnpm install --frozen-lockfile
              pnpm run build
              pnpm publish --no-git-checks --access public
