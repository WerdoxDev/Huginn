name: checks

on:
   pull_request:
   push:
      branches:
         - master
         - release
   workflow_dispatch:

permissions:
   contents: read

jobs:
   app:
      name: App and repository checks
      runs-on: ubuntu-latest
      env:
         CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - uses: actions/setup-node@v4
           with:
              node-version: "24"

         - uses: pnpm/action-setup@v4

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Check app and changed repository tooling
           run: pnpm check
